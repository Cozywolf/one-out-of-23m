<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400" role="img" aria-label="農民曆撕日曆與新芽">
<style>
*{stroke:#4b2a20;stroke-width:3.6;stroke-linejoin:round;stroke-linecap:round}
pattern *{stroke:none}
.tile{fill:#fbf0d9;stroke:none}.pbg{fill:#cfe5dc;stroke:none}
